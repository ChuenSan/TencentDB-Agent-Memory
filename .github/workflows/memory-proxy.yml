name: MemoryProxy

on:
  push:
    branches: [feat/server_team]
    paths:
      - "MemoryProxy/**"
      - ".github/workflows/memory-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MemoryProxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: MemoryProxy/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
        continue-on-error: true

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: MemoryProxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/chuensan/tencentdb-agent-memory-proxy:${{ github.sha }}
            ghcr.io/chuensan/tencentdb-agent-memory-proxy:feat-server-team
          cache-from: type=gha
          cache-to: type=gha,mode=max
